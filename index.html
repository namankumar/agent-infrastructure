<main><aside><strong>Todo</strong><nav id="projects" aria-label="Workspace"></nav></aside><article><header><button id="refresh-workspace" style="float:right">Refresh</button><h1 id="heading">Everything captured</h1><p id="objective" class="muted"></p></header>
<details id="save-preferences"><summary>Saving preferences</summary><div id="save-options"></div></details>
<details class="capture-toggle"><summary>Capture a note</summary><form id="capture-form"><label for="capture">Get it out of your head.</label><textarea id="capture" placeholder="A thought, a promise, a messy note…" required></textarea><div class="row"><button class="primary" type="submit">Save note</button></div><p class="muted">Saved immediately. Organized automatically when capture is enabled.</p></form></details>
<div id="notice" role="status" aria-live="polite"></div><div id="content"></div></article></main>
<dialog id="task-view"><button type="button" id="task-close" style="float:right">Close</button><div id="task-detail"></div></dialog>
<dialog id="editor"><form id="edit-form"><h2>Correct this item</h2><label>Title<input id="edit-title" required></label><label>Project<select id="edit-project"></select></label><div class="row"><label>Kind<select id="edit-kind"><option value="task">Task</option><option value="goal">Goal</option><option value="idea">Idea</option><option value="decision">Decision</option><option value="context">Context</option></select></label><label>Status<select id="edit-status"><option value="open">Open</option><option value="waiting">Waiting</option><option value="blocked">Blocked</option><option value="parked">Parked</option><option value="canceled">Canceled</option><option value="done">Done (I confirm)</option></select></label></div><label>Context<textarea id="edit-detail"></textarea></label><label>Next action (for a goal)<select id="edit-next-action"><option value="">No next action linked</option></select></label><label>Blocked by / waiting for<input id="edit-blocker"></label><fieldset><legend>Task dependencies</legend><div id="edit-dependencies"></div></fieldset><label>Latest progress<textarea id="edit-progress"></textarea></label><label>Your correction / why<textarea id="edit-reason" required placeholder="Keep your wording so we remember what changed."></textarea></label><p id="edit-error" role="alert"></p><div class="row"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save correction</button></div></form></dialog>
<dialog id="priority-editor"><form id="priority-form"><h2>Set priority</h2><p id="priority-title"></p><label>Position (leave empty to remove from your priorities)<input id="priority-position" type="number" min="1" step="1"></label><label>Why this matters now<textarea id="priority-reason" required></textarea></label><label>Deadline, only if one is agreed<input id="priority-due" type="date"></label><fieldset><legend>Depends on</legend><div id="priority-dependencies"></div></fieldset><p id="priority-error" role="alert"></p><button type="button" id="priority-refresh" hidden>Refresh order to review</button><div class="row"><button type="button" id="priority-cancel">Cancel</button><button class="primary" type="submit">Save my priority</button></div></form></dialog>
<script nonce="__TOKEN__">
const token='__TOKEN__';let state={},priorityState={},selected="board",editing=null,captureAttempt=null,correctionAttempt=null,priorityEditing=null,priorityAttempt=null;
const $=id=>document.getElementById(id);
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
let savePrefs={destination:'unset',version:0};
function renderSavePreferences(){
 const panel=$('save-preferences'),content=$('save-options');if(!panel||!content)return;
 if(panel.dataset.preference!==savePrefs.destination){panel.open=savePrefs.destination==='unset';panel.dataset.preference=savePrefs.destination}content.replaceChildren();
 content.append(el('p',savePrefs.destination==='unset'?'Use Todo as your default place to save work from chats?':savePrefs.destination==='todo'?'Unspecified saves go to Todo.':'Choose a destination when saving.'));
 content.append(el('p','Explicit files and personal-memory requests keep their destinations. This does not grant background chat access.','muted'));
 for(const [destination,label] of [['todo','Use Todo'],['ask','Choose each time']]){
  const b=el('button',label);b.disabled=savePrefs.destination===destination;
  b.onclick=async()=>{const buttons=[...content.querySelectorAll('button')];buttons.forEach(x=>x.disabled=true);try{savePrefs=await api('/api/save-preferences',{destination,version:savePrefs.version,evidence:'User selected '+label+' in Saving preferences'});renderSavePreferences();$('notice').textContent='Saving preference updated. Available assistants use this choice; it does not change ChatGPT settings automatically.'}catch(e){$('notice').textContent=e.message;buttons.forEach(x=>x.disabled=false)}};content.append(b)
 }
}
async function api(path,data){const r=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json','X-Capture-Token':token},body:JSON.stringify(data)}:{});const value=await r.json();if(!r.ok)throw Error(value.error||'Could not save');return value}
async function load(){[state,priorityState,savePrefs]=await Promise.all([api('/api/state'),api('/api/priorities'),api('/api/save-preferences')]);render();renderSavePreferences()}
let recordGeneration=0;
let tablesGeneration=0,tableSearch='',tableProject=null;
function tableValue(v,type){if(v==null)return '—';if(type==='currency')return '$'+Number(v).toLocaleString();if(type==='currency_range')return '$'+v.min.toLocaleString()+'–$'+v.max.toLocaleString()+(v.plus_local_travel?' + local travel':'');if(typeof v==='object')return JSON.stringify(v);return String(v)}
async function renderTables(){
 const gen=++tablesGeneration;$('heading').textContent='Tables';$('objective').textContent='Comparisons, lists and things you’re thinking through. A project is optional.';const content=$('content');content.replaceChildren();
 const search=el('input');search.placeholder='Find a table';search.value=tableSearch;search.setAttribute('aria-label','Find a table');const find=el('button','Search');const bar=el('form');bar.append(search,find);bar.onsubmit=e=>{e.preventDefault();tableSearch=search.value;renderTables()};content.append(bar);
 const create=el('details');create.append(el('summary','New table'));const form=el('form'),title=el('input');title.placeholder='Table name';title.required=true;title.setAttribute('aria-label','Table name');const project=el('select');project.setAttribute('aria-label','Table project');const none=el('option','No project');none.value='';project.append(none);for(const p of state.projects){const o=el('option',p.name);o.value=p.id;project.append(o)}const add=el('button','Create table');form.append(title,project,add);create.append(form);content.append(create);
 form.onsubmit=async e=>{e.preventDefault();add.disabled=true;try{const id=crypto.randomUUID();await api('/api/table-edit',{id,version:0,request_id:crypto.randomUUID(),operations:[{op:'create',title:title.value,project_id:project.value||null,context:'',columns:[{id:'item',label:'Item',type:'text'}]}]});if(gen===tablesGeneration&&selected==='tables')showTable(id)}catch(e){$('notice').textContent=e.message}finally{add.disabled=false}};
 const results=el('div');content.append(results);
 async function page(after=''){try{const result=await api('/api/tables',{query:tableSearch,...(tableProject?{project_id:tableProject}:{}),after,limit:30});if(gen!==tablesGeneration||selected!=='tables')return;results.replaceChildren();if(tableProject){const all=el('button','Show all tables');all.onclick=()=>{tableProject=null;renderTables()};results.append(all)}for(const t of result.tables){const card=el('section',undefined,'card'),b=el('button',t.title);b.onclick=()=>showTable(t.id);card.append(b,el('p',t.row_count+' rows · '+(state.projects.find(p=>p.id===t.project_id)?.name||'No project'),'muted'));results.append(card)}if(!result.tables.length)results.append(el('p','No tables here yet. Create one or ask Todo to save a comparison.'));if(result.next){const next=el('button','Next page');next.onclick=()=>page(result.next);results.append(next)}}catch(e){if(gen===tablesGeneration&&selected==='tables')results.textContent=e.message}}
 await page();
}
async function showTable(id,version=null){
 const gen=++tablesGeneration;const content=$('content');content.replaceChildren(el('p','Loading table…'));
 try{
 const record=await api('/api/table',{id,...(version?{version}:{})});if(gen!==tablesGeneration||selected!=='tables')return;
 $('heading').textContent=record.title;$('objective').textContent='Version '+record.version+(version?' · read-only history':' · edits save to this same table');content.replaceChildren();
 const back=el('button','All tables');back.onclick=()=>{tableProject=null;renderTables()};content.append(back);
 const history=el('select');history.setAttribute('aria-label','Table version');const current=el('option','Latest version');current.value='';history.append(current);const latest=version?(await api('/api/table',{id})).version:record.version;if(gen!==tablesGeneration||selected!=='tables')return;for(let v=latest;v>=Math.max(1,latest-99);v--){const o=el('option','Version '+v);o.value=v;history.append(o)}history.value=version||'';history.onchange=()=>showTable(id,history.value?Number(history.value):null);content.append(history);
 const context=el('details');context.append(el('summary','Context, assumptions & source'));const body=el('p',record.body);body.style.whiteSpace='pre-wrap';context.append(body,el('blockquote',record.quote));content.append(context);
 if(record.data.table_schema!==1){content.append(el('p','This is an earlier saved comparison. Its original content is preserved above.'));return}
 const d=record.data;let busy=false;
 async function change(operations){if(busy)return;busy=true;const controls=[...content.querySelectorAll('input,select,textarea,button')];controls.forEach(c=>c.disabled=true);try{await api('/api/table-edit',{id,version:record.version,request_id:crypto.randomUUID(),operations});if(gen===tablesGeneration&&selected==='tables')await showTable(id)}catch(e){if(gen===tablesGeneration&&selected==='tables'){$('notice').textContent=e.message+' Your edit has not been saved. Reload latest before retrying.';const reload=el('button','Reload latest');reload.onclick=()=>showTable(id);content.append(reload)}}finally{busy=false;controls.forEach(c=>c.disabled=false)}}
 if(!version){const details=el('details');details.append(el('summary','Table settings'));const form=el('form'),name=el('input');name.value=record.title;name.setAttribute('aria-label','Rename table');const project=el('select');project.setAttribute('aria-label','Move table to project');const none=el('option','No project');none.value='';project.append(none);for(const p of state.projects){const o=el('option',p.name);o.value=p.id;project.append(o)}project.value=d.project_id||'';const note=el('textarea');note.value=record.body;note.setAttribute('aria-label','Table context');const save=el('button','Save table settings');form.append(name,project,note,save);form.onsubmit=e=>{e.preventDefault();change([{op:'metadata',title:name.value,project_id:project.value||null,context:note.value}])};details.append(form);content.append(details)}
 const filter=el('input');filter.placeholder='Filter rows';filter.setAttribute('aria-label','Filter rows');content.append(filter);const wrap=el('div');wrap.style.overflowX='auto';content.append(wrap);let sort=null,dir=1;const visible=new Set(d.columns.slice(0,7).map(c=>c.id));const chooser=el('details');chooser.append(el('summary','Columns'));for(const col of d.columns){const label=el('label'),check=el('input');check.type='checkbox';check.checked=visible.has(col.id);check.onchange=()=>{check.checked?visible.add(col.id):visible.delete(col.id);draw()};label.append(check,document.createTextNode(' '+col.label));chooser.append(label)}content.insertBefore(chooser,wrap);
 function draw(){wrap.replaceChildren();const grid=el('table');grid.className='living-table';const head=el('tr');for(const col of d.columns.filter(c=>visible.has(c.id))){const th=el('th'),b=el('button',col.label+(sort===col.id?(dir===1?' ↑':' ↓'):''));b.onclick=()=>{dir=sort===col.id?-dir:1;sort=col.id;draw()};th.append(b);head.append(th)}grid.append(head);
 let rows=d.rows.filter(r=>Object.values(r.cells).some(v=>tableValue(v,'json').toLowerCase().includes(filter.value.toLowerCase())));if(sort)rows=[...rows].sort((a,b)=>{const x=a.cells[sort],y=b.cells[sort];if(x==null)return y==null?0:1;if(y==null)return -1;return dir*(typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),undefined,{numeric:true}))});
 for(const row of rows){const tr=el('tr');tr.dataset.row=row.id;for(const col of d.columns.filter(c=>visible.has(c.id))){const td=el('td'),v=row.cells[col.id];if(version||['json','currency_range'].includes(col.type)){td.textContent=tableValue(v,col.type);if(!version)td.title='Ask Todo to update this structured value'}else{const input=el('input');input.setAttribute('aria-label',col.label+' · '+row.id);input.dataset.column=col.id;if(col.type==='boolean'){input.type='checkbox';input.checked=v===true;input.indeterminate=v==null}else{input.type=['number','currency'].includes(col.type)?'number':'text';if(input.type==='number')input.step='any';input.value=v??'';input.placeholder='—'}input.onchange=()=>change([{op:'row',id:row.id,cells:{[col.id]:col.type==='boolean'?input.checked:input.value===''?null:['number','currency'].includes(col.type)?Number(input.value):input.value}}]);td.append(input)}tr.append(td)}grid.append(tr)}wrap.append(grid);if(!rows.length)wrap.append(el('p','No matching rows.'))}
 filter.oninput=draw;draw();
 if(!version){const addRow=el('form'),label=el('input');label.placeholder='New item';label.required=true;label.setAttribute('aria-label','New row');const col=d.columns.find(c=>c.type==='text');if(col){const add=el('button','Add row');addRow.append(label,add);addRow.onsubmit=e=>{e.preventDefault();change([{op:'row',id:crypto.randomUUID(),cells:{[col.id]:label.value}}])};content.append(addRow)}
 const details=el('details');details.append(el('summary','Add a column'));const form=el('form'),name=el('input');name.placeholder='Column name';name.required=true;name.setAttribute('aria-label','Column name');const type=el('select');type.setAttribute('aria-label','Column type');for(const [value,title] of [['text','Text'],['number','Number'],['currency','Money'],['boolean','Checkbox']]){const o=el('option',title);o.value=value;type.append(o)}const add=el('button','Add column');form.append(name,type,add);form.onsubmit=e=>{e.preventDefault();change([{op:'column',column:{id:crypto.randomUUID(),label:name.value,type:type.value}}])};details.append(form);content.append(details)}
 }catch(e){if(gen===tablesGeneration&&selected==='tables')content.replaceChildren(el('p',e.message))}
}

let recordQuery='';
async function renderRecords(){
 const generation=++recordGeneration;
 $('heading').textContent='Saved';$('objective').textContent='Find your tasks, notes, decisions and tables in one place.';
 const content=$('content');content.replaceChildren();
 const form=el('form'),query=el('input'),search=el('button','Search');
 query.placeholder='Search everything saved';query.value=recordQuery;query.setAttribute('aria-label','Search saved work');form.append(query,search);content.append(form);
 const results=el('div');content.append(results);let searchGeneration=0;
 async function show(after=''){
  recordQuery=query.value;const searchVersion=++searchGeneration;
  results.textContent='Loading…';
  try{
   const page=await api('/api/records',{query:query.value,after,limit:30});
   if(selected!=='records'||generation!==recordGeneration||searchVersion!==searchGeneration)return;
   results.replaceChildren();
   const words=query.value.toLocaleLowerCase().trim().split(/\s+/).filter(Boolean);
   const matches=(state.items||[]).filter(item=>{const p=(state.projects||[]).find(p=>p.id===item.project_id);const text=[item.title,item.detail,item.status,p?.name,p?.objective].join(' ').toLocaleLowerCase();return words.every(w=>text.includes(w))});
   if(!after&&matches.length){results.append(el('h2','Work items'));for(const item of matches){const card=el('section',undefined,'task-card'),open=el('button',item.title,'task-open');open.onclick=()=>openTask(item.id);card.append(open,el('span',item.status,'tag'));results.append(card)}}
   if(page.records.length)results.append(el('h2','Notes & tables'));
   for(const row of page.records){const card=el('section',undefined,'card'),button=el('button',row.title,'task-open');card.append(button,el('p',row.kind+' · '+row.collection,'muted'));results.append(card);

 const item=state.items.find(i=>i.id===id);if(!item)return;const content=$('task-detail');content.replaceChildren();content.append(el('h2',item.title));
 if(item.progress_note)content.append(el('p',item.progress_note));if(item.blocker)content.append(el('p','Waiting on: '+item.blocker,'muted'));if(item.detail)content.append(el('p',item.detail,'task-description'));
 if(item.steps?.length){content.append(el('h3','Steps'));for(const step of item.steps){const label=el('label',undefined,'step-row'),check=el('input');check.type='checkbox';check.checked=step.done;check.onchange=async()=>{check.disabled=true;const steps=item.steps.map(s=>s.id===step.id?{...s,done:check.checked}:s);await changeTask(item,{steps},check.checked?'I completed this step: '+step.title:'I reopened this step: '+step.title);openTask(id)};label.append(check,el('span',step.title));content.append(label)}}
 if(item.kind==='task'&&item.project_id){const board=projectBoard(item.project_id),label=el('label','Stage'),select=el('select');select.setAttribute('aria-label','Stage');const blank=el('option','To place');blank.value='';select.append(blank);for(const stage of board.data.stages){const o=el('option',stage.title);o.value=stage.id;select.append(o)}select.value=board.data.stages.find(s=>s.item_ids.includes(id))?.id||'';select.onchange=async()=>{await moveStage(item,select.value||null);openTask(id)};label.append(select);content.append(label)}
 const actions=el('div',undefined,'row');const editButton=el('button','Edit');editButton.onclick=()=>{$('task-view').close();edit(item)};actions.append(editButton);
 if(item.kind==='task'&&!['done','canceled'].includes(item.status)){const priority=el('button','Set priority');priority.onclick=()=>{$('task-view').close();editPriority(item)};actions.append(priority)}content.append(actions);
 const proof=el('details');proof.append(el('summary','Sources & changes'));for(const evidence of state.evidence.filter(e=>e.item_id===id)){proof.append(el('p',state.sources.find(s=>s.id===evidence.source_id)?.label||evidence.source_id,'muted'),el('blockquote',evidence.quote))}for(const event of state.events.filter(e=>e.item_id===id)){const entry=el('details');entry.append(el('summary','Change · '+event.created),el('pre',event.current));proof.append(entry)}content.append(proof);
 if(!$('task-view').open)$('task-view').showModal();
}

$('refresh-workspace').onclick=()=>load().catch(e=>$('notice').textContent=e.message);
window.addEventListener('focus',()=>{if(state.items&&!document.querySelector('[data-note-editor][open]')&&!$('editor').open&&!$('priority-editor').open&&!$('task-view').open)load().catch(e=>$('notice').textContent=e.message)});
load().catch(e=>$('notice').textContent=e.message);
</script></html>
